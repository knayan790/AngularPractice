name: Angular CI

on:
  push:
    branches:
      - Development

  pull_request:
    branches:
      - Development

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check Node and npm versions
        run: |
          node -v
          npm -v
          npm config get package-lock

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: npm run build